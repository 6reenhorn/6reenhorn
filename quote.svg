<svg width="700" height="150" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#000000" />
  
  <!-- Static Quote -->
  <text x="50%" y="40%" text-anchor="middle"
        font-family="Courier New, monospace" font-size="18" fill="#39FF14" font-weight="bold">
    Every repo is a step forward. Every bug, a lesson.
  </text>

  <!-- Animated "Consistentia" -->
  <g font-family="Courier New, monospace" font-size="28" fill="#FF00FF">
    <text x="23%" y="80%">
      <tspan>
        <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0s" fill="freeze" />
        C
      </tspan>
      <tspan>
        <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.2s" fill="freeze" />
        o
      </tspan>
      <tspan>
        <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.4s" fill="freeze" />
        n
      </tspan>
      <tspan>
        <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.6s" fill="freeze" />
        s
      </tspan>
      <tspan>
        <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.8s" fill="freeze" />
        i
      </tspan>
      <tspan>
        <animate attributeName="opacity" values="0;1" dur="0.9s" begin="1s" fill="freeze" />
        s
      </tspan>
      <tspan>
        <animate attributeName="opacity" values="0;1" dur="0.9s" begin="1.2s" fill="freeze" />
        t
      </tspan>
      <tspan>
        <animate attributeName="opacity" values="0;1" dur="0.9s" begin="1.4s" fill="freeze" />
        e
      </tspan>
      <tspan>
        <animate attributeName="opacity" values="0;1" dur="0.9s" begin="1.6s" fill="freeze" />
        n
      </tspan>
      <tspan>
        <animate attributeName="opacity" values="0;1" dur="0.9s" begin="1.8s" fill="freeze" />
        t
      </tspan>
      <tspan>
        <animate attributeName="opacity" values="0;1" dur="0.9s" begin="2s" fill="freeze" />
        i
      </tspan>
      <tspan>
        <animate attributeName="opacity" values="0;1" dur="0.9s" begin="2.2s" fill="freeze" />
        a
      </tspan>
    </text>
  </g>
</svg>
